name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app main.py
      - name: Verify Marketapp integration and fixed fees
        run: |
          python - <<'PY'
          from decimal import Decimal
          from app.core.enums import Currency
          from app.services.fragment import FragmentService
          from app.services.pricing import PriceService

          assert FragmentService is not None
          assert PriceService._with_fixed_markup(
              Decimal("1.0229388"), Currency.TON
          ) == Decimal("1.076900000")
          assert PriceService._with_fixed_markup(
              Decimal("1.50"), Currency.USDT
          ) == Decimal("1.880000")
          PY
