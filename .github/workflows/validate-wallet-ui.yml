name: validate-wallet-ui

on:
  push:
    branches:
      - wallet-ui-settlement-20261013

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app main.py
      - name: Import changed modules
        run: |
          python - <<'PY'
          from decimal import Decimal, ROUND_UP
          from app.handlers import create_router
          from app.keyboards.menu import settings_keyboard, documents_keyboard
          from app.services.pricing import PriceService
          from app.services.settlement import SettlementService
          from app.tasks.workers import WorkerManager
          assert Decimal('0.584902224').quantize(Decimal('0.001'), rounding=ROUND_UP) == Decimal('0.585')
          assert create_router() is not None
          assert settings_keyboard() is not None
          assert documents_keyboard() is not None
          print('validation ok')
          PY
