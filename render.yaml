services:
  - type: web
    name: stars-premium-shop
    runtime: docker
    plan: starter
    healthCheckPath: /health
    autoDeploy: false
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TON_RECEIVER_ADDRESS
        sync: false
      - key: TONCENTER_API_KEY
        sync: false
      - key: FRAGMENT_JWT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: TELEGRAM_USE_POLLING
        value: "true"
      - key: PAYMENT_TTL_MINUTES
        value: "15"
      - key: WORKER_INTERVAL_SECONDS
        value: "10"

