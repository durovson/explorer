services:
  - type: web
    name: stars-premium-shop
    runtime: python
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: TON_RECEIVER_ADDRESS
        sync: false
      - key: TONCENTER_API_KEY
        sync: false
      - key: MARKETAPP_API_TOKEN
        sync: false
      - key: MARKETAPP_WALLET_SEED
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: SUPPORT_URL
        sync: false
      - key: TELEGRAM_USE_POLLING
        value: "false"
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: MARKETAPP_WALLET_VERSION
        value: "V5R1"
      - key: PAYMENT_TTL_MINUTES
        value: "15"
      - key: WORKER_INTERVAL_SECONDS
        value: "10"
      - key: FULFILLMENT_LEASE_SECONDS
        value: "180"
